<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOST_TRAIL_LOGS</title>
    <style>
        /* ================= 基礎終端機樣式 ================= */
        body {
            background-color: #050505;
            color: #00cc00;
            font-family: "Courier New", Courier, monospace;
            padding: 2rem;
            line-height: 1.6;
            overflow-x: hidden;
            margin: 0;
        }

        ::selection { background-color: #ffffff; color: #000000; }
        
        #terminal-container {
            max-width: 900px;
            margin: 0 auto;
            padding-bottom: 60px;
        }

        /* 文字層級與顏色 */
        .sys-msg { color: #00cc00; margin-bottom: 15px; }
        .log-data { color: #88dd88; margin-bottom: 15px; border-left: 2px solid #004400; padding-left: 15px; }
        .sys-alert { color: #ffaa00; margin-bottom: 15px; font-weight: bold; }
        .fatal-error { color: #ff3333; margin-bottom: 15px; text-shadow: 0 0 5px red; font-weight: bold; }
        .admin-override { color: #ffffff; margin-bottom: 15px; font-style: italic; text-shadow: 0 0 3px #ffffff; }

        /* 打字機游標 */
        .cursor {
            display: inline-block;
            width: 10px; height: 1.2rem;
            background-color: currentColor;
            animation: blink 1s infinite;
            vertical-align: bottom;
            margin-left: 2px;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        
        /* 畫面強烈震動特效 */
        .screen-shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-4px, 0, 0); filter: drop-shadow(2px 0 red); }
            20%, 80% { transform: translate3d(6px, 0, 0); filter: drop-shadow(-2px 0 blue); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); filter: drop-shadow(4px 0 magenta); }
            40%, 60% { transform: translate3d(8px, 0, 0); filter: drop-shadow(-4px 0 cyan); }
        }

        /* 閃爍文字特效 (一閃而過) */
        .flash-text {
            animation: flash-anim 1s forwards;
            opacity: 0;
        }
        @keyframes flash-anim {
            0% { opacity: 0; filter: blur(2px); }
            10% { opacity: 1; filter: blur(0); }
            80% { opacity: 1; filter: blur(0); }
            100% { opacity: 0; filter: blur(5px); }
        }

        /* ================= 彈窗與按鈕樣式 ================= */
        .btn {
            background-color: transparent;
            border: 1px solid #00cc00;
            color: #00cc00;
            padding: 8px 20px;
            font-family: "Courier New", Courier, monospace;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }
        .btn:hover { background-color: #00cc00; color: #000; }

        /* 密碼彈窗背景 */
        #password-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(3px);
        }

        /* 密碼彈窗本體 */
        .modal-content {
            background-color: #050505;
            border: 1px solid #ffaa00;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.15);
        }

        #puzzle-input {
            background-color: #000;
            color: #00cc00;
            border: 1px solid #00cc00;
            padding: 10px 15px;
            font-family: "Courier New", Courier, monospace;
            font-size: 1rem;
            outline: none;
            width: 300px;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 20px;
            display: block;
        }
        #puzzle-input:focus { box-shadow: 0 0 8px rgba(0, 204, 0, 0.5); }
    </style>
</head>
<body>

    <!-- 音樂設定 -->
    <audio id="terminal-bgm" src="盲文.mp3" loop></audio>

    <div id="terminal-container">
        <!-- 腳本會自動將終端機文字打在這裡 -->
    </div>

    <!-- 底部按鈕區 (初始隱藏) -->
    <div id="action-section" style="display: none; text-align: right; max-width: 900px; margin: 0 auto; margin-top: 30px;">
        <button class="btn" onclick="openModal()">> 管理員日誌</button>
    </div>

    <!-- 密碼驗證彈窗 -->
    <div id="password-modal">
        <div class="modal-content">
            <div style="color: #ffaa00; margin-bottom: 20px; font-weight: bold; letter-spacing: 2px;">[ 存取權限驗證 ]</div>
            <input type="text" id="puzzle-input" placeholder="輸入解碼意涵...">
            <div style="display: flex; justify-content: center; gap: 15px;">
                <button class="btn" style="border-color: #ffaa00; color: #ffaa00;" onclick="verifyPassword()">> 執行</button>
                <button class="btn" onclick="closeModal()">> 取消</button>
            </div>
            <div id="error-msg" style="color: #ff3333; margin-top: 15px; display: none; font-weight: bold;">[ 驗證失敗：密鑰不符 ]</div>
        </div>
    </div>

    <script>
        // --- 劇情腳本設定 ---
        const scriptLines = [
            { class: 'sys-msg', text: "> 正在存取管理員資產日誌 (GHOST_TRAIL_LOGS)..." },
            { class: 'sys-msg', text: "> 權限已覆寫。正在載入 資產_01, 資產_02, 資產_03 的實體行動數據..." },
            { class: 'sys-msg', instant: true, text: "==================================================" },
            { class: 'log-data', text: "[ 實體活動時間軸比對 // 第36週期 ]\n> 資產_01 (阿斯蘭朵) 啟動區間：00:00:00 - 07:59:59\n> 資產_02 (新星聯邦) 啟動區間：08:00:00 - 15:59:59\n> 資產_03 (灰燼之地) 啟動區間：16:00:00 - 23:59:59" },

              // 加密偏移量直接放在這裡瞬間顯示
            { class: 'sys-alert', instant: true, text: "> [ 系統提示：底層資料發生位移，加密偏移量 (OFFSET) : -3 ]" },
            // 異常報告瞬間顯示
            { class: 'sys-alert', instant: true, text: "> [ 異常報告 ]：三名資產的出現時間「絕對互斥」。生命體徵重疊率 0.00%。\n> [ 系統結論 ]：此為單一意識的多重線程切換。\n> 正在追蹤底層 IP 來源..." },
          
            
            { class: 'log-data', text: "資產_01 來源 IP: 127.0.0.1 [ LOCAL_HOST_ADMIN ]\n資產_02 來源 IP: 127.0.0.1 [ LOCAL_HOST_ADMIN ]\n資產_03 來源 IP: 127.0.0.1 [ LOCAL_HOST_ADMIN ]" },
            
            // 分隔線瞬間顯示
            { class: 'sys-msg', instant: true, text: "--------------------------------------------------" },
            
            // 盲文區塊 (與系統文字相同格式綠色，字體稍大一點方便辨識)
            { class: 'sys-msg', text: "⠚⠧&nbsp;&nbsp;&nbsp;⠞⠋⠏⠑", style: "font-size: 2.5rem; letter-spacing: 8px; margin: 20px 0;" },

            { class: 'sys-msg', text: "> 系統狀態：世界熵值崩壞邊緣。啟動最終安全協議。" },
            { class: 'sys-msg', text: "> EXECUTE: TIME_REVERT(-3_YEARS)" },
            { class: 'sys-msg', text: "> 正在啟動時間軸回溯協定...\n> 逆轉因果律中... 10% ... 45% ... 89% ..." },
            
            // 致命錯誤瞬間顯示，並引發震動
            { class: 'fatal-error', instant: true, text: "> [ 致命錯誤 ]：因果律悖論！本體靈魂質量嚴重耗損，無法達到回溯閾值。" },
            { class: 'sys-alert', instant: true, text: "> [ 系統判定 ]：管理員權限已永久損毀，無法再次回溯至三年前。" },
            
            // 心聲一閃而過 (flash: true)
            { class: 'admin-override', flash: true, text: "「為什麼...為什麼這次不行？」" },
            { class: 'admin-override', flash: true, text: "「我明明已經殺了他們...我明明已經習慣了被你憎恨...」" },
            { class: 'admin-override', flash: true, text: "「我只是...想回到最開始的時候...回到我們還是朋友的時候...」" }
        ];

        window.onload = function() {
            const bgm = document.getElementById("terminal-bgm");
            bgm.volume = 0;
            bgm.play().catch(e => console.log("BGM blocked", e));
            let vol = 0;
            const fadeIn = setInterval(() => {
                if (vol < 0.6) { vol += 0.05; bgm.volume = vol; }
                else clearInterval(fadeIn);
            }, 200);

            playScript();
        };

        async function playScript() {
            const container = document.getElementById("terminal-container");
            
            for (let i = 0; i < scriptLines.length; i++) {
                const lineData = scriptLines[i];
                const div = document.createElement("div");
                div.className = lineData.class;
                if (lineData.style) div.style.cssText = lineData.style;
                container.appendChild(div);
                
                const text = lineData.text;

                // 處理震動與切歌
                if (lineData.class === 'fatal-error' && text.includes("因果律悖論")) {
                    document.body.classList.add("screen-shake");
                    setTimeout(() => document.body.classList.remove("screen-shake"), 600);
                    
                    document.getElementById("terminal-bgm").pause();
                    const sadBgm = document.getElementById("terminal-bgm");
                    sadBgm.volume = 0;
                    sadBgm.play().catch(e => console.log(e));
                    
                    let newVol = 0;
                    const fadeIn = setInterval(() => {
                        if (newVol < 0.7) { newVol += 0.05; sadBgm.volume = newVol; }
                        else clearInterval(fadeIn);
                    }, 200);
                }

                // 判斷是否為「瞬間顯示」
                if (lineData.instant) {
                    div.innerHTML = text.replace(/\n/g, "<br>");
                    window.scrollTo(0, document.body.scrollHeight);
                    await new Promise(r => setTimeout(r, 400));
                } 
                // 判斷是否為「一閃而過」
                else if (lineData.flash) {
                    div.classList.add("flash-text"); // 加入閃爍動畫
                    div.innerHTML = text;
                    window.scrollTo(0, document.body.scrollHeight);
                    await new Promise(r => setTimeout(r, 1200)); // 讓閃爍動畫跑完
                    div.style.display = "none"; // 播完後隱藏
                } 
                // 一般打字機效果
                else {
                    const cursor = document.createElement("span");
                    cursor.className = "cursor";
                    let currentHTML = "";

                    for (let j = 0; j < text.length; j++) {
                        if (text.charAt(j) === '\n') {
                            currentHTML += "<br>";
                        } else {
                            currentHTML += text.charAt(j);
                        }
                        div.innerHTML = currentHTML;
                        div.appendChild(cursor);
                        
                        let speed = 40; 
                        window.scrollTo(0, document.body.scrollHeight);
                        await new Promise(r => setTimeout(r, speed));
                    }
                    cursor.remove();
                    await new Promise(r => setTimeout(r, 400)); 
                }
            }
            
            // 腳本全數結束後，顯示底部的管理員日誌按鈕
            document.getElementById("action-section").style.display = "block";
            window.scrollTo(0, document.body.scrollHeight);
        }

        // --- 彈窗與驗證邏輯 ---
        function openModal() {
            document.getElementById("password-modal").style.display = "flex";
            document.getElementById("puzzle-input").focus();
        }

        function closeModal() {
            document.getElementById("password-modal").style.display = "none";
            document.getElementById("error-msg").style.display = "none";
            document.getElementById("puzzle-input").value = "";
        }

        function verifyPassword() {
            const inputField = document.getElementById("puzzle-input");
            const errorMsg = document.getElementById("error-msg");
            
            let answer = inputField.value.toLowerCase().replace(/\s+/g, '');
            
            // 點字 J V   T F P E，退 3 格後明文為 M Y   W I S H
            if (answer === "mywish") {
                errorMsg.style.display = "none";
                fadeOutAndNavigate("admin.html", "terminal-bgm"); // 音樂漸弱並跳轉
            } else {
                errorMsg.style.display = "block";
                inputField.value = "";
                inputField.focus();
            }
        }

        document.getElementById("puzzle-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                verifyPassword();
            }
        });

        // --- 音樂淡出並跳轉頁面 ---
        function fadeOutAndNavigate(targetUrl, bgmId) {
            // 隱藏彈窗內容，讓畫面只剩黑屏背景
            document.querySelector(".modal-content").style.display = "none";

            const bgm = document.getElementById(bgmId);
            if (bgm && !bgm.paused) {
                let vol = bgm.volume;
                const fadeOut = setInterval(() => {
                    if (vol > 0.05) { 
                        vol -= 0.05; 
                        bgm.volume = vol; 
                    } else { 
                        clearInterval(fadeOut); 
                        bgm.pause(); 
                        window.location.href = targetUrl; 
                    }
                }, 100); 
            } else {
                window.location.href = targetUrl;
            }
        }
    </script>
</body>
</html>
