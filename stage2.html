<!DOCTYPE html>
<html lang="zh-TW">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOST_TRAIL_LOGS</title>
    <style>
        /* ================= 基礎終端機樣式 ================= */
        body {
            background-color: #050505;
            color: #00cc00;
            font-family: "Courier New", Courier, monospace;
            padding: 2rem;
            line-height: 1.6;
            overflow-x: hidden;
            margin: 0;
        }

        ::selection { background-color: #ffffff; color: #000000; }
        
        #terminal-container {
            max-width: 900px;
            margin: 0 auto;
            padding-bottom: 60px;
        }

        /* 不同的文字層級與顏色 */
        .sys-msg { color: #00cc00; margin-bottom: 15px; }
        .log-data { color: #88dd88; margin-bottom: 15px; border-left: 2px solid #004400; padding-left: 15px; }
        .sys-alert { color: #ffaa00; margin-bottom: 15px; font-weight: bold; }
        .fatal-error { color: #ff3333; margin-bottom: 15px; text-shadow: 0 0 5px red; font-weight: bold; }
        .admin-override { color: #ffffff; margin-bottom: 15px; font-style: italic; text-shadow: 0 0 3px #ffffff; }
        .memory-log { color: #aaffaa; margin-bottom: 15px; border-left: 2px solid #aaffaa; padding-left: 15px; font-style: italic;}

        /* 打字機游標 */
        .cursor {
            display: inline-block;
            width: 10px; height: 1.2rem;
            background-color: currentColor;
            animation: blink 1s infinite;
            vertical-align: bottom;
            margin-left: 2px;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* 盲文解謎區 (初始隱藏) */
        #braille-section {
            display: none;
            margin-top: 50px;
            border: 1px solid #333;
            padding: 40px;
            background-color: rgba(10, 10, 10, 0.9);
            text-align: center;
            animation: fadeIn 2s ease-in;
            box-shadow: 0 0 20px rgba(0, 204, 0, 0.1);
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .braille-word {
            display: inline-block;
            font-size: 2.5rem;
            letter-spacing: 5px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
            margin: 0 15px 20px 15px;
        }

        .hint-text {
            color: #ffaa00;
            font-size: 0.95rem;
            margin-bottom: 30px;
            letter-spacing: 1px;
            border-bottom: 1px dashed #ffaa00;
            display: inline-block;
            padding-bottom: 5px;
        }

        /* 互動輸入區 */
        .btn {
            background-color: transparent;
            border: 1px solid #00cc00;
            color: #00cc00;
            padding: 8px 20px;
            font-family: "Courier New", Courier, monospace;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }
        .btn:hover { background-color: #00cc00; color: #000; }

        #puzzle-input {
            background-color: #000;
            color: #00cc00;
            border: 1px solid #00cc00;
            padding: 10px 15px;
            font-family: "Courier New", Courier, monospace;
            font-size: 1rem;
            outline: none;
            width: 350px;
            text-align: center;
            letter-spacing: 2px;
        }
        #puzzle-input:focus { box-shadow: 0 0 8px rgba(0, 204, 0, 0.5); }
        
        /* 畫面強烈震動特效 */
        .screen-shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-4px, 0, 0); filter: drop-shadow(2px 0 red); }
            20%, 80% { transform: translate3d(6px, 0, 0); filter: drop-shadow(-2px 0 blue); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); filter: drop-shadow(4px 0 magenta); }
            40%, 60% { transform: translate3d(8px, 0, 0); filter: drop-shadow(-4px 0 cyan); }
        }

        /* ================= 隱藏的管理員日記區 ================= */
        #admin-log-screen {
            display: none;
            max-width: 800px;
            margin: 40px auto;
            background-color: rgba(5, 5, 5, 0.95);
            border: 1px solid #ffaa00;
            padding: 40px;
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.1);
            line-height: 1.8;
            opacity: 0;
            transition: opacity 1.5s ease;
        }
    </style>
</head>
<body>

    <!-- 音樂設定 -->
    <audio id="terminal-bgm" src="終端機懸疑.mp3" loop></audio>
    <audio id="sad-bgm" src="悲傷真相.mp3" loop></audio>

    <div id="terminal-container">
        <!-- 腳本會自動將終端機文字打在這裡 -->
    </div>

    <!-- 盲文與凱撒密碼解謎區 -->
    <div id="braille-section">
        <div class="hint-text">> [ 系統提示：底層資料發生位移，加密偏移量 (OFFSET) : -3 ]</div>
        
        <!-- 加密過後的字串：JV TFPE -->
        <!-- 對應明文為：MY WISH (我的心願) -->
        <div style="margin-bottom: 20px;">
            <div class="braille-word">⠚⠧</div> <!-- JV -->
            <div class="braille-word">⠞⠋⠏⠑</div> <!-- TFPE -->
        </div>

        <div style="display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 30px;">
            <input type="text" id="puzzle-input" placeholder="輸入還原後的原始字串...">
            <!-- 按鈕文字已改為「管理員日誌」 -->
            <button class="btn" onclick="verifyBraille()">> 管理員日誌</button>
        </div>
        <div id="error-msg" style="color: #ff3333; margin-top: 15px; display: none; font-weight: bold; text-shadow: 0 0 5px red;">[ 驗證失敗：密鑰不符，存取拒絕 ]</div>
    </div>

    <!-- 成功解鎖後的管理員自白畫面 -->
    <div id="admin-log-screen">
        <div id="admin-log-content"></div>
        <div id="next-stage-btn" style="display: none; text-align: right; margin-top: 40px;">
            <a href="stage3.html" class="btn" style="border-color: #ffaa00; color: #ffaa00;">> 終止程序。</a>
        </div>
    </div>

    <script>
        // --- 第一階段：軌跡腳本設定 ---
        const scriptLines = [
            { class: 'sys-msg', text: "> 正在存取幽靈軌跡日誌 (GHOST_TRAIL_LOGS)..." },
            { class: 'sys-msg', text: "> 權限已覆寫。正在載入 資產_01, 資產_02, 資產_03 的實體行動數據..." },
            { class: 'sys-msg', text: "==================================================" },
            { class: 'log-data', text: "[ 實體活動時間軸比對 // 第36週期 ]\n> 資產_01 (阿斯蘭朵) 啟動區間：00:00:00 - 07:59:59\n> 資產_02 (新星聯邦) 啟動區間：08:00:00 - 15:59:59\n> 資產_03 (灰燼之地) 啟動區間：16:00:00 - 23:59:59" },
            { class: 'sys-alert', text: "> [ 異常報告 ]：三名資產的出現時間「絕對互斥」。生命體徵重疊率 0.00%。\n> [ 系統結論 ]：此為單一意識的多重線程切換。\n> 正在追蹤底層 IP 來源..." },
            { class: 'log-data', text: "資產_01 來源 IP: 127.0.0.1 [ LOCAL_HOST_ADMIN ]\n資產_02 來源 IP: 127.0.0.1 [ LOCAL_HOST_ADMIN ]\n資產_03 來源 IP: 127.0.0.1 [ LOCAL_HOST_ADMIN ]" },
            { class: 'sys-alert', text: "> [ 警告 ]：所有被處決的資產，皆為管理員本體的靈魂碎片切片。" },
            { class: 'admin-override', text: "「只有剝離我對這世界最後的眷戀，我才能毫不猶豫地揮下屠刀。」" },
            { class: 'sys-msg', text: "--------------------------------------------------" },
            { class: 'sys-msg', text: "> [ 警告：擷取到受損的舊日記憶區塊 ]" },
            { class: 'memory-log', text: "「在戴上這頂王冠之前，我們也曾並肩坐在營火旁。那時候，我們只是並肩作戰的傻瓜。你說我們有一天會改變世界。」" },
            { class: 'memory-log', text: "「但我發現，只要沒有共同的敵人，各方陣營就會因為無止境的猜忌與貪婪互相撕裂。世界依然走向了毀滅。」" },
            { class: 'memory-log', text: "「我一次又一次地啟動權限，將時間回溯到三年前。每一次，我都試圖把和平還給你們，但每一次，我只能看著你們在戰火中死去。」" },
            { class: 'memory-log', text: "「所以，這一次，第36次輪迴...我選擇成為你們共同的敵人。只要你們恨我，只要你們有了共同的暴君，世界就能團結。」" },
            { class: 'sys-msg', text: "--------------------------------------------------" },
            { class: 'sys-msg', text: "> 系統狀態：世界熵值崩壞邊緣。啟動最終安全協議。" },
            { class: 'sys-msg', text: "> EXECUTE: TIME_REVERT(-3_YEARS)" },
            { class: 'sys-msg', text: "> 正在啟動時間軸回溯協定...\n> 逆轉因果律中... 10% ... 45% ... 89% ..." },
            // 致命錯誤引發畫面震動
            { class: 'fatal-error', text: "> [ 致命錯誤 ]：因果律悖論！本體靈魂質量嚴重耗損，無法達到回溯閾值。" },
            { class: 'sys-alert', text: "> [ 系統判定 ]：管理員已將過多靈魂碎片化為『資產』並親手摧毀。權限已永久損毀，無法再次回溯至三年前。" },
            { class: 'admin-override', text: "「為什麼...為什麼這次不行？」" },
            { class: 'admin-override', text: "「我明明已經殺了那些會讓我軟弱的碎片...我明明已經習慣了被你憎恨...」" },
            { class: 'admin-override', text: "「我只是...想回到最開始的時候...回到我們還是朋友的時候...」" }
        ];

        window.onload = function() {
            const bgm = document.getElementById("terminal-bgm");
            bgm.volume = 0;
            bgm.play().catch(e => console.log("BGM blocked", e));
            let vol = 0;
            const fadeIn = setInterval(() => {
                if (vol < 0.6) { vol += 0.05; bgm.volume = vol; }
                else clearInterval(fadeIn);
            }, 200);

            playScript();
        };

        async function playScript() {
            const container = document.getElementById("terminal-container");
            
            for (let i = 0; i < scriptLines.length; i++) {
                const lineData = scriptLines[i];
                const div = document.createElement("div");
                div.className = lineData.class;
                container.appendChild(div);
                
                const cursor = document.createElement("span");
                cursor.className = "cursor";
                
                let currentHTML = "";
                const text = lineData.text;

                if (lineData.class === 'fatal-error' && text.includes("因果律悖論")) {
                    document.body.classList.add("screen-shake");
                    setTimeout(() => document.body.classList.remove("screen-shake"), 600);
                    
                    document.getElementById("terminal-bgm").pause();
                    const sadBgm = document.getElementById("sad-bgm");
                    sadBgm.volume = 0;
                    sadBgm.play().catch(e => console.log(e));
                    
                    let newVol = 0;
                    const fadeIn = setInterval(() => {
                        if (newVol < 0.7) { newVol += 0.05; sadBgm.volume = newVol; }
                        else clearInterval(fadeIn);
                    }, 200);
                }

                for (let j = 0; j < text.length; j++) {
                    if (text.charAt(j) === '\n') {
                        currentHTML += "<br>";
                    } else {
                        currentHTML += text.charAt(j);
                    }
                    div.innerHTML = currentHTML;
                    div.appendChild(cursor);
                    
                    let speed = 40; 
                    if (lineData.class === 'admin-override') speed = 70; 
                    if (['，', '。', '！', '？', '\n', '...'].includes(text.charAt(j))) speed += 350; 
                    
                    window.scrollTo(0, document.body.scrollHeight);
                    await new Promise(r => setTimeout(r, speed));
                }
                
                cursor.remove();
                await new Promise(r => setTimeout(r, 600)); 
            }
            
            document.getElementById("braille-section").style.display = "block";
            window.scrollTo(0, document.body.scrollHeight);
        }

        // --- 第二階段：驗證密碼與切換自白 ---
        function verifyBraille() {
            const inputField = document.getElementById("puzzle-input");
            const errorMsg = document.getElementById("error-msg");
            
            let answer = inputField.value.toLowerCase().replace(/\s+/g, '');
            
            // 點字 J V   T F P E，退 3 格後明文為 M Y   W I S H
            if (answer === "mywish") {
                errorMsg.style.display = "none";
                
                // 隱藏解謎區塊，顯示管理員日誌區塊
                document.getElementById("braille-section").style.display = "none";
                const logScreen = document.getElementById("admin-log-screen");
                logScreen.style.display = "block";
                
                setTimeout(() => {
                    logScreen.style.opacity = 1;
                    playAdminLog();
                }, 100);
                
            } else {
                errorMsg.style.display = "block";
                inputField.value = "";
                inputField.focus();
            }
        }

        document.getElementById("puzzle-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                verifyBraille();
            }
        });

        // --- 第三階段：管理員第一視角獨白腳本 ---
        async function playAdminLog() {
            const container = document.getElementById("admin-log-content");
            const actionBtn = document.getElementById("next-stage-btn");
            
            // 管理員日誌劇本
            const adminLines = [
                { class: 'sys-msg', style: 'color: #ffaa00; border-left: 3px solid #ffaa00; padding-left: 15px;', text: "> [ 身份驗證通過。歡迎回來，管理員。 ]\n> [ 正在解密隱藏日誌檔... ]" },
                { class: 'sys-msg', style: 'color: #dddddd;', text: "如果這份日誌被解密，說明我的時間已經到了，而你成功駭入了這裡。" },
                { class: 'sys-msg', style: 'color: #dddddd;', text: "這是我最後的心願。也是我唯一能留下來的真相。" },
                { class: 'sys-msg', style: 'color: #dddddd;', text: "三年前，當我們還圍繞在營火旁時，我以為只要擁有了管理員的權限，就能保護所有人。但我錯了。" },
                { class: 'sys-msg', style: 'color: #dddddd;', text: "權力沒有帶來和平，反而讓各方陣營為了爭奪資源自相殘殺。我一次次地回溯時間，卻只能一次次看著你——我最好的朋友，死在不同的戰火裡。" },
                { class: 'sys-msg', style: 'color: #dddddd;', text: "為了打破這個死局，世界需要一個共同的敵人。" },
                { class: 'sys-msg', style: 'color: #dddddd;', text: "我割裂了自己的靈魂，將他們散佈在各個陣營，然後親手以最殘忍的方式處決他們。只有這樣，我才能成為真正的暴君。只有當你們把所有的恨意都指向我，你們才會團結。" },
                { class: 'sys-msg', style: 'color: #dddddd;', text: "我把自己變成了怪物，把你們推向了反抗軍的位置。" },
                { class: 'sys-msg', style: 'color: #dddddd;', text: "但我好累...我不想再當神，也不想再當暴君了。" },
                { class: 'sys-msg', style: 'color: #dddddd;', text: "我的靈魂已經碎裂到無法再次啟動回溯...所以，這一次，動手吧。" },
                { class: 'sys-msg', style: 'color: #ffffff; text-shadow: 0 0 5px #ffffff; font-size: 1.2rem;', text: "毀滅我。然後，連同我的那份一起活下去。" }
            ];

            for (let i = 0; i < adminLines.length; i++) {
                const lineData = adminLines[i];
                const div = document.createElement("div");
                div.className = lineData.class;
                if (lineData.style) div.style.cssText = lineData.style;
                container.appendChild(div);
                
                const cursor = document.createElement("span");
                cursor.className = "cursor";
                cursor.style.backgroundColor = (i===0) ? "#ffaa00" : "#dddddd";
                
                let currentHTML = "";
                const text = lineData.text;

                for (let j = 0; j < text.length; j++) {
                    if (text.charAt(j) === '\n') {
                        currentHTML += "<br>";
                    } else {
                        currentHTML += text.charAt(j);
                    }
                    div.innerHTML = currentHTML;
                    div.appendChild(cursor);
                    
                    let speed = Math.random() * 30 + 40; 
                    if (['，', '。', '？', '！', '\n'].includes(text.charAt(j))) speed += 400; 
                    
                    window.scrollTo(0, document.body.scrollHeight);
                    await new Promise(r => setTimeout(r, speed));
                }
                
                cursor.remove();
                await new Promise(r => setTimeout(r, 1000)); 
            }
            
            // 顯示最終結束按鈕
            actionBtn.style.display = "block";
            window.scrollTo(0, document.body.scrollHeight);
        }
    </script>
</body>
</html>
