<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENDING A: SACRIFICE</title>
    <style>
        body { 
            background-color: #000000; 
            color: #ffffff; 
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            height: 100vh; 
            margin: 0; 
            overflow: hidden; 
        }

        /* 共通舞台設定 */
        .stage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 800px;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            pointer-events: none;
            text-align: center;
        }
        .stage.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 第一階段：敘事文字 */
        #text-container {
            line-height: 2.2;
            font-size: 1.1rem;
            letter-spacing: 3px;
        }
        .fade-text {
            opacity: 0;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            transition: opacity 2.5s ease-in-out;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        /* 第二階段：幾何撕裂與雜訊崩潰特效 */
        #glitch-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #111;
            z-index: 999;
            overflow: hidden;
        }
        
        /* 純 CSS 生成的底層電視雜訊 */
        #glitch-screen::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noise"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noise)"/%3E%3C/svg%3E');
            opacity: 0.15;
            pointer-events: none;
            z-index: 1000;
        }

        /* 動態生成的水平撕裂色塊 */
        .glitch-band {
            position: absolute;
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        /* 第三階段：系統中止宣告 */
        #system-terminated {
            font-family: "Courier New", Courier, monospace;
            color: #aaaaaa;
            font-size: 1.5rem;
            letter-spacing: 5px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
        /* 第四階段：最終結語新增的墓誌銘 */
        .epitaph {
            font-size: 1.1rem;
            letter-spacing: 4px;
            line-height: 2.2;
            color: #dddddd;
            margin-bottom: 60px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        /* 第四階段：最終結語 */
        .title { font-size: 2.5rem; letter-spacing: 15px; margin-bottom: 20px; font-weight: bold; color: #fff; }
        .sub { font-size: 1.2rem; letter-spacing: 5px; color: #aaaaaa; margin-bottom: 50px; }
        
        .btn { 
            background: transparent; border: 1px solid #555; color: #888; 
            padding: 10px 30px; cursor: pointer; text-decoration: none; letter-spacing: 3px; transition: all 0.5s; 
            display: inline-block;
        }
        .btn:hover { border-color: #fff; color: #fff; box-shadow: 0 0 15px rgba(255,255,255,0.3); }
    </style>
</head>
<body>

    <!-- 結局音樂 -->
    <audio id="end-bgm" src="A.mp3" loop></audio>

    <!-- 階段一：敘事區 -->
    <div id="stage-1" class="stage active">
        <div id="text-container"></div>
    </div>

    <!-- 階段二：崩潰撕裂區 (灰階雜訊風格) -->
    <div id="glitch-screen"></div>

    <!-- 階段三：系統中止宣告 -->
    <div id="stage-3" class="stage">
        <div id="system-terminated">> [ 系統已徹底終止。伺服器永久離線。 ]</div>
    </div>

   <!-- 階段四：結局標題區 -->
    <div id="stage-4" class="stage">
        <div class="epitaph">
            世界正為暴君的殞落而歡呼慶祝，<br>
            卻獨留你在這片無聲的廢墟中，緬懷故友。
        </div>
        <div class="title">DEVOTION</div>
        <div class="sub">ENDING A - يأبرني 願你埋葬我</div>
        <a onclick="fadeOutAndNavigate('index.html', 'end-bgm')" class="btn">斷開連線 LOGOUT</a>
    </div>

    <script>
        const narrativeLines = [
            "[ 系統自毀程序已啟動。伺服器離線中... ]",
            "你親手按下了終止鍵。<br>摧毀了核心，也摧毀了他最後的意識。",
            "外面的天空亮了。<br>長達三年的戰火，終於在共同的暴君倒下後，迎來了終結。",
            "他的計畫成功了。",
            "這個世界將會迎來新生，而在史書的記載裡，<br>沒有人會知道這個暴君真正的名字。",
            "也沒有人會知道，他曾經也只是個喜歡坐在營火旁，<br>笑著談論未來的笨蛋。",
        ];

        window.onload = async function() {
            // 音樂淡入
            const bgm = document.getElementById("end-bgm");
            if (bgm) {
                bgm.volume = 0;
                bgm.play().catch(e => console.log("BGM blocked", e));
                let vol = 0;
                const fadeIn = setInterval(() => {
                    if (vol < 0.6) { vol += 0.02; bgm.volume = vol; } 
                    else { clearInterval(fadeIn); }
                }, 200);
            }

            const container = document.getElementById("text-container");
            await new Promise(r => setTimeout(r, 2000));

            for (let i = 0; i < narrativeLines.length; i++) {
                const div = document.createElement("div");
                div.className = "fade-text";
                div.innerHTML = narrativeLines[i];
                container.appendChild(div);
                
                setTimeout(() => { div.style.opacity = 1; }, 100);
                const stayTime = 3500 + (narrativeLines[i].length * 100);
                await new Promise(r => setTimeout(r, stayTime));
                
                div.style.opacity = 0;
                await new Promise(r => setTimeout(r, 2500));
                div.remove();
            }

            await new Promise(r => setTimeout(r, 1000));
            triggerSystemCrash();
        };

        // --- 系統崩潰特效模組 (柔和灰階撕裂版) ---
        async function triggerSystemCrash() {
            const glitchScreen = document.getElementById("glitch-screen");
            const stage1 = document.getElementById("stage-1");
            const stage3 = document.getElementById("stage-3");
            const stage4 = document.getElementById("stage-4");
            
            stage1.style.display = "none";
            glitchScreen.style.display = "block";

            // 注意：這裡不暫停音樂，讓音樂隨著畫面變黑過渡到「歡樂」的段落

            let glitchInterval = setInterval(() => {
                glitchScreen.innerHTML = ''; 
                
                const bandCount = Math.floor(Math.random() * 8) + 8;
                const colors = ['#000000', '#1a1a1a', '#333333', '#888888', '#dddddd', '#ffffff'];

                for(let i = 0; i < bandCount; i++) {
                    let band = document.createElement("div");
                    band.className = "glitch-band";
                    
                    band.style.left = (Math.random() * 100 - 20) + "%"; 
                    band.style.top = Math.random() * 100 + "%";
                    band.style.width = (Math.random() * 100 + 50) + "%"; 
                    band.style.height = (Math.random() * 8 + 1) + "vh"; 
                    
                    band.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    glitchScreen.appendChild(band);
                }
            }, 250); 

            // 崩潰持續 2 秒後，全黑
            await new Promise(r => setTimeout(r, 2000));
            clearInterval(glitchInterval);
            glitchScreen.style.display = "none";

            // 死寂黑畫面等待 2 秒
            await new Promise(r => setTimeout(r, 2000));

            // 浮現「系統已徹底終止」
            stage3.classList.add("active");
            
            // 停留 4 秒後淡出
            await new Promise(r => setTimeout(r, 4000));
            stage3.classList.remove("active");

            // 最後帶出結局標題
            await new Promise(r => setTimeout(r, 2500));
            stage4.classList.add("active");
        }

        function fadeOutAndNavigate(targetUrl, bgmId) {
            const finalStage = document.getElementById("stage-4");
            const bgm = document.getElementById(bgmId);

            if (finalStage) {
                finalStage.style.transition = "opacity 2s ease";
                finalStage.style.opacity = 0;
            }

            // 按下按鈕後，讓音樂淡出並跳轉
            if (bgm && !bgm.paused) {
                let vol = bgm.volume;
                const fadeOut = setInterval(() => {
                    if (vol > 0.05) { 
                        vol -= 0.05; 
                        bgm.volume = Math.max(0, vol); 
                    } else { 
                        clearInterval(fadeOut); 
                        bgm.pause(); 
                        window.location.href = targetUrl; 
                    }
                }, 150); 
            } else {
                setTimeout(() => { window.location.href = targetUrl; }, 2500);
            }
        }
    </script>
</body>
</html>
