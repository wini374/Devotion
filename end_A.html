<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENDING A: SACRIFICE</title>
    <style>
        body { 
            background-color: #000000; 
            color: #ffffff; 
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            height: 100vh; 
            margin: 0; 
            overflow: hidden; 
        }

        /* 共通舞台設定 */
        .stage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 800px;
            opacity: 0;
            transition: opacity 1.5s ease-in-out; /* 加快舞台切換速度 */
            pointer-events: none;
            text-align: center;
        }
        .stage.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 第一階段：敘事文字 */
        #text-container {
            line-height: 2.2;
            font-size: 1.1rem;
            letter-spacing: 3px;
        }
        .fade-text {
            opacity: 0;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            transition: opacity 1.5s ease-in-out; /* 字幕淡入淡出變快 */
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        /* 第二階段：崩潰特效 (包含亂碼刷屏與撕裂) */
        #glitch-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #111;
            z-index: 999;
            overflow: hidden;
        }
        
        /* 亂碼刷屏 (透明度 30%) */
        #code-spam {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            color: #cccccc;
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
            line-height: 1;
            opacity: 0.3; /* 透屏度 30 */
            word-break: break-all;
            overflow: hidden;
            z-index: 1;
        }

        /* 純 CSS 生成的底層電視雜訊 */
        #glitch-screen::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noise"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noise)"/%3E%3C/svg%3E');
            opacity: 0.15;
            pointer-events: none;
            z-index: 1000;
        }

        /* 動態生成的水平撕裂色塊 */
        .glitch-band {
            position: absolute;
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
            z-index: 2;
        }
        #band-container {
            position: absolute; width: 100%; height: 100%; top:0; left:0; z-index: 2;
        }

        /* 第三階段：系統中止宣告 */
        #system-terminated {
            font-family: "Courier New", Courier, monospace;
            color: #aaaaaa;
            font-size: 1.5rem;
            letter-spacing: 5px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        /* 第四階段：最終結語與墓誌銘 */
        .epitaph {
            font-size: 1.1rem;
            letter-spacing: 4px;
            line-height: 2.2;
            color: #dddddd;
            margin-bottom: 60px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
        .title { font-size: 2.5rem; letter-spacing: 15px; margin-bottom: 20px; font-weight: bold; color: #fff; }
        .sub { font-size: 1.2rem; letter-spacing: 5px; color: #aaaaaa; margin-bottom: 50px; }
        
        .btn { 
            background: transparent; border: 1px solid #555; color: #888; 
            padding: 10px 30px; cursor: pointer; text-decoration: none; letter-spacing: 3px; transition: all 0.5s; 
            display: inline-block;
        }
        .btn:hover { border-color: #fff; color: #fff; box-shadow: 0 0 15px rgba(255,255,255,0.3); }
    </style>
</head>
<body>

    <!-- 結局音樂 (維持播放，不中斷) -->
    <audio id="end-bgm" src="A.mp3" loop></audio>

    <!-- 階段一：敘事區 -->
    <div id="stage-1" class="stage active">
        <div id="text-container"></div>
    </div>

    <!-- 階段二：崩潰撕裂與亂碼刷屏區 -->
    <div id="glitch-screen">
        <div id="code-spam"></div>
        <div id="band-container"></div>
    </div>

    <!-- 階段三：系統中止宣告 -->
    <div id="stage-3" class="stage">
        <div id="system-terminated">> [ 系統已徹底終止。伺服器永久離線。 ]</div>
    </div>

    <!-- 階段四：結局標題與墓誌銘 -->
    <div id="stage-4" class="stage">
        <div class="epitaph">
            世界正為暴君的殞落而歡呼慶祝，<br>
            卻獨留你在這片無聲的廢墟中，緬懷故友。
        </div>
        <div class="title">DEVOTION</div>
        <div class="sub">ENDING A - يأبرني 願你埋葬我</div>
        <a onclick="fadeOutAndNavigate('index.html', 'end-bgm')" class="btn">斷開連線 LOGOUT</a>
    </div>

    <script>
        window.onload = async function() {
            // 音樂淡入
            const bgm = document.getElementById("end-bgm");
            if (bgm) {
                bgm.volume = 0;
                bgm.play().catch(e => console.log("BGM blocked", e));
                let vol = 0;
                const fadeIn = setInterval(() => {
                    if (vol < 0.6) { vol += 0.02; bgm.volume = vol; } 
                    else { clearInterval(fadeIn); }
                }, 200);
            }

            const container = document.getElementById("text-container");
            await new Promise(r => setTimeout(r, 1000));

            // 1. 顯示第一句 (快速)
            const sysDiv = document.createElement("div");
            sysDiv.className = "fade-text";
            sysDiv.innerHTML = "[ 系統自毀程序已啟動。伺服器離線中... ]";
            container.appendChild(sysDiv);
            
            setTimeout(() => { sysDiv.style.opacity = 1; }, 50);
            await new Promise(r => setTimeout(r, 2500)); // 只停留短短 2.5 秒
            sysDiv.style.opacity = 0;
            await new Promise(r => setTimeout(r, 1000));
            sysDiv.remove();

            // 2. 緊接著觸發系統崩潰
            await triggerSystemCrash();

            // 3. 在崩潰後的黑屏中，快速播放剩餘字幕
            const epilogueLines = [
                "你親手按下了終止鍵。<br>摧毀了核心，也摧毀了他最後的意識。",
                "外面的天空亮了。<br>長達三年的戰火，終於在暴君倒下後，迎來了終結。",
                "他的計畫成功了。",
                "這個世界將會迎來新生，而在史書的記載裡，<br>沒有人會知道這個暴君真正的名字。",
                "也沒有人會知道，他曾經也只是個喜歡坐在營火旁，<br>笑著談論未來的笨蛋。"
            ];

            for (let i = 0; i < epilogueLines.length; i++) {
                const div = document.createElement("div");
                div.className = "fade-text";
                div.innerHTML = epilogueLines[i];
                container.appendChild(div);
                
                setTimeout(() => { div.style.opacity = 1; }, 50);
                // 大幅縮短停留時間 (從原本的 3500 降到 2000)
                const stayTime = 2000 + (epilogueLines[i].length * 80); 
                await new Promise(r => setTimeout(r, stayTime));
                
                div.style.opacity = 0;
                await new Promise(r => setTimeout(r, 1500)); // 縮短淡出間隔
                div.remove();
            }

            // 4. 最後帶出結局標題與墓誌銘
            await new Promise(r => setTimeout(r, 1000));
            document.getElementById("stage-4").classList.add("active");
        };

        // --- 系統崩潰特效模組 (加入 30% 透明度亂碼) ---
        async function triggerSystemCrash() {
            const glitchScreen = document.getElementById("glitch-screen");
            const codeSpam = document.getElementById("code-spam");
            const bandContainer = document.getElementById("band-container");
            const stage1 = document.getElementById("stage-1");
            const stage3 = document.getElementById("stage-3");
            
            stage1.style.display = "none";
            glitchScreen.style.display = "block";

            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()_+-=[]{}|;:,.<>?/\\";
            const colors = ['#000000', '#1a1a1a', '#333333', '#888888', '#dddddd', '#ffffff'];

            let glitchInterval = setInterval(() => {
                // 1. 產生透屏度 30 的滿畫面亂碼
                let randomCode = "";
                for (let i = 0; i < 2000; i++) {
                    randomCode += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                codeSpam.innerText = randomCode;

                // 2. 產生水平撕裂色塊
                bandContainer.innerHTML = ''; 
                const bandCount = Math.floor(Math.random() * 8) + 8;
                for(let i = 0; i < bandCount; i++) {
                    let band = document.createElement("div");
                    band.className = "glitch-band";
                    band.style.left = (Math.random() * 100 - 20) + "%"; 
                    band.style.top = Math.random() * 100 + "%";
                    band.style.width = (Math.random() * 100 + 50) + "%"; 
                    band.style.height = (Math.random() * 8 + 1) + "vh"; 
                    band.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    bandContainer.appendChild(band);
                }
            }, 200); // 稍微調快一點點，讓亂碼更有瘋狂刷屏感

            // 崩潰持續 2.5 秒後，瞬間全黑
            await new Promise(r => setTimeout(r, 2500));
            clearInterval(glitchInterval);
            glitchScreen.style.display = "none";

            // 死寂黑畫面等待 1.5 秒
            await new Promise(r => setTimeout(r, 1500));

            // 浮現「系統已徹底終止」 (加快節奏)
            stage3.classList.add("active");
            await new Promise(r => setTimeout(r, 3000));
            stage3.classList.remove("active");

            // 等待淡出後，回到上層的字幕迴圈
            await new Promise(r => setTimeout(r, 1500));
            stage1.style.display = "block"; // 重新打開文字容器
        }

        function fadeOutAndNavigate(targetUrl, bgmId) {
            const finalStage = document.getElementById("stage-4");
            const bgm = document.getElementById(bgmId);

            if (finalStage) {
                finalStage.style.transition = "opacity 2s ease";
                finalStage.style.opacity = 0;
            }

            if (bgm && !bgm.paused) {
                let vol = bgm.volume;
                const fadeOut = setInterval(() => {
                    if (vol > 0.05) { 
                        vol -= 0.05; 
                        bgm.volume = Math.max(0, vol); 
                    } else { 
                        clearInterval(fadeOut); 
                        bgm.pause(); 
                        window.location.href = targetUrl; 
                    }
                }, 150); 
            } else {
                setTimeout(() => { window.location.href = targetUrl; }, 2500);
            }
        }
    </script>
</body>
</html>
