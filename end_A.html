<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENDING A: SACRIFICE</title>
    <style>
        body { 
            background-color: #000000; 
            color: #ffffff; 
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            height: 100vh; 
            margin: 0; 
            overflow: hidden; 
        }

        /* 共通舞台設定 */
        .stage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 550px; /* 【修改】縮小黑框的寬度 */
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            pointer-events: none;
            text-align: center;
            z-index: 10;
        }
        .stage.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 背景亂碼層 (滿屏設計) */
        #glitch-bg {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 10vw; height: 10vh;
            background-color: #000;
            z-index: 1;
            overflow: hidden;
            opacity: 0;
            transition: opacity 1s ease;
        }
        #code-spam {
            width: 100%; height: 100%;
            color: #444444; 
            font-family: "Courier New", Courier, monospace;
            font-size: 14px; /* 稍微縮小字體以容納更多代碼 */
            letter-spacing: 1px;
            line-height: 1.1;
            word-break: break-all;
            opacity: 0.8; /* 提高代碼透明度，讓其更清晰 */
        }
        #glitch-bg::after {
            content: "";
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.5) 3px, rgba(0,0,0,0.5) 4px);
            pointer-events: none;
        }

        /* 第一階段：敘事文字與半透明緊湊底框 */
        #stage-1 {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 150px;
            transition: all 1s ease;
        }
        .glass-box {
            background-color: rgba(10, 10, 10, 0.85); 
            border: 1px solid #333;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            border-radius: 6px;
            padding: 30px 40px; /* 【修改】縮小內邊距，讓框更緊湊 */
        }

        #text-container {
            line-height: 2; /* 稍微調整行高 */
            font-size: 1.1rem;
            letter-spacing: 3px;
            width: 100%;
            position: relative;
        }
        .fade-text {
            opacity: 0;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            transition: opacity 1.5s ease-in-out;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
        }

        /* 瞬間黑白故障閃爍層 */
        #bw-glitch {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #fff; /* 以白色為底的刺眼閃爍 */
            z-index: 9999;
            overflow: hidden;
        }
        .bw-band {
            position: absolute;
        }
        .flash-anim {
            animation: bwFlash 0.1s infinite;
        }
        @keyframes bwFlash {
            0% { filter: invert(0); transform: translate(5px, -5px); }
            50% { filter: invert(1); transform: translate(-5px, 5px); }
            100% { filter: invert(0); transform: translate(0, 0); }
        }

        /* 第三階段：系統中止宣告 */
        #system-terminated {
            font-family: "Courier New", Courier, monospace;
            color: #aaaaaa;
            font-size: 1.5rem;
            letter-spacing: 5px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        /* 第四階段：結局標題與墓誌銘 */
        #stage-4 { max-width: 800px; } /* 放寬最後結局畫面的寬度 */
        .epitaph {
            font-size: 1.1rem;
            letter-spacing: 4px;
            line-height: 2.2;
            color: #dddddd;
            margin-bottom: 60px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
        .title { font-size: 2.5rem; letter-spacing: 15px; margin-bottom: 20px; font-weight: bold; color: #fff; }
        .sub { font-size: 1.2rem; letter-spacing: 5px; color: #aaaaaa; margin-bottom: 50px; }
        
        .btn { 
            background: transparent; border: 1px solid #555; color: #888; 
            padding: 10px 30px; cursor: pointer; text-decoration: none; letter-spacing: 3px; transition: all 0.5s; 
            display: inline-block;
        }
        .btn:hover { border-color: #fff; color: #fff; box-shadow: 0 0 15px rgba(255,255,255,0.3); }
    </style>
</head>
<body>

    <!-- 結局音樂 -->
    <audio id="end-bgm" src="A.mp3" loop></audio>

    <!-- 背景崩潰代碼層 -->
    <div id="glitch-bg">
        <div id="code-spam"></div>
    </div>

    <!-- 瞬間黑白故障層 -->
    <div id="bw-glitch"></div>

    <!-- 階段一：敘事區 -->
    <div id="stage-1" class="stage active">
        <div id="text-container"></div>
    </div>

    <!-- 階段三：系統中止宣告 -->
    <div id="stage-3" class="stage" style="max-width: 800px;">
        <div id="system-terminated">> [ 系統已徹底終止。伺服器永久離線。 ]</div>
    </div>

    <!-- 階段四：結局標題與墓誌銘 -->
    <div id="stage-4" class="stage">
        <div class="epitaph">
            世界正為暴君的殞落而歡呼慶祝，<br>
            卻獨留你在這片無聲的廢墟中，緬懷故友。
        </div>
        <div class="title">DEVOTION</div>
        <div class="sub">ENDING A - يأبرني 願你埋葬我</div>
        <a onclick="fadeOutAndNavigate('index.html', 'end-bgm')" class="btn">斷開連線 LOGOUT</a>
    </div>

    <script>
        let glitchInterval;

        window.onload = async function() {
            // 音樂淡入
            const bgm = document.getElementById("end-bgm");
            if (bgm) {
                bgm.volume = 0;
                bgm.play().catch(e => console.log("BGM blocked", e));
                let vol = 0;
                const fadeIn = setInterval(() => {
                    if (vol < 0.6) { vol += 0.02; bgm.volume = vol; } 
                    else { clearInterval(fadeIn); }
                }, 200);
            }

            const container = document.getElementById("text-container");
            await new Promise(r => setTimeout(r, 1000));

            // 1. 顯示啟動提示
            const sysDiv = document.createElement("div");
            sysDiv.className = "fade-text";
            sysDiv.innerHTML = "[ 系統自毀程序已啟動。伺服器離線中... ]";
            container.appendChild(sysDiv);
            
            setTimeout(() => { sysDiv.style.opacity = 1; }, 50);
            await new Promise(r => setTimeout(r, 2500)); 
            sysDiv.style.opacity = 0;
            await new Promise(r => setTimeout(r, 1500));
            sysDiv.remove();

            // 2. 啟動背景滿屏亂碼與小黑框
            startBackgroundGlitch();
            document.getElementById("stage-1").classList.add("glass-box");

            // 3. 在崩潰的背景下，依序播放敘事文字
            const epilogueLines = [
                "你親手按下了終止鍵。<br>摧毀了核心，也摧毀了他最後的意識。",
                "外面的天空亮了。<br>長達三年的戰火，終於在暴君倒下後，迎來了終結。",
                "他的計畫成功了。",
                "這個世界將會迎來新生，而在史書的記載裡，<br>沒有人會知道這個暴君真正的名字。",
                "也沒有人會知道，他曾經也只是個喜歡坐在營火旁，<br>笑著談論未來的笨蛋。"
            ];

            for (let i = 0; i < epilogueLines.length; i++) {
                const div = document.createElement("div");
                div.className = "fade-text";
                div.innerHTML = epilogueLines[i];
                container.appendChild(div);
                
                setTimeout(() => { div.style.opacity = 1; }, 50);
                const stayTime = 2500 + (epilogueLines[i].length * 80); 
                await new Promise(r => setTimeout(r, stayTime));
                
                div.style.opacity = 0;
                await new Promise(r => setTimeout(r, 1500)); 
                div.remove();
            }

            // 4. 文字播放完畢，執行黑白故障與最終死亡
            await endSystemCrash();
        };

        // --- 背景滿屏亂碼生成函數 ---
        function startBackgroundGlitch() {
            const glitchBg = document.getElementById("glitch-bg");
            const codeSpam = document.getElementById("code-spam");
            
            glitchBg.style.display = "block";
            setTimeout(() => { glitchBg.style.opacity = 1; }, 50);

            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()_+-=[]{}|;:,.<>?/\\";
            glitchInterval = setInterval(() => {
                let randomCode = "";
                // 生成極大量的字元以確保填滿 100vw/100vh 的螢幕
                for (let i = 0; i < 6000; i++) {
                    randomCode += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                codeSpam.innerText = randomCode;
            }, 80); // 稍微調快一點點
        }

        // --- 瞬間黑白故障與系統關閉函數 ---
        async function endSystemCrash() {
            const stage1 = document.getElementById("stage-1");
            const glitchBg = document.getElementById("glitch-bg");
            const bwGlitch = document.getElementById("bw-glitch");
            const stage3 = document.getElementById("stage-3");
            const stage4 = document.getElementById("stage-4");
            
            // 瞬間關閉敘事小框框
            stage1.style.display = "none";

            // 觸發強烈的黑白畫面撕裂 (持續 0.8 秒)
            bwGlitch.style.display = "block";
            bwGlitch.classList.add("flash-anim");
            
            let bwInterval = setInterval(() => {
                bwGlitch.innerHTML = '';
                const bandCount = Math.floor(Math.random() * 10) + 10;
                const bwColors = ['#000000', '#ffffff', '#cccccc', '#333333', '#777777'];

                for(let i = 0; i < bandCount; i++) {
                    let band = document.createElement("div");
                    band.className = "bw-band";
                    band.style.left = (Math.random() * 100 - 20) + "%"; 
                    band.style.top = Math.random() * 100 + "%";
                    band.style.width = (Math.random() * 100 + 50) + "%"; 
                    band.style.height = (Math.random() * 10 + 1) + "vh"; 
                    band.style.backgroundColor = bwColors[Math.floor(Math.random() * bwColors.length)];
                    bwGlitch.appendChild(band);
                }
            }, 60);

            // 讓玩家承受 0.8 秒的視覺震撼
            await new Promise(r => setTimeout(r, 800));

            // 瞬間斷電，所有亂碼與閃爍停止，陷入純黑
            clearInterval(bwInterval);
            clearInterval(glitchInterval);
            bwGlitch.style.display = "none";
            glitchBg.style.display = "none";

            // 死寂黑畫面等待 1.5 秒
            await new Promise(r => setTimeout(r, 1500));

            // 浮現「系統已徹底終止」
            stage3.classList.add("active");
            await new Promise(r => setTimeout(r, 3500));
            stage3.classList.remove("active");

            // 再次黑屏過渡後，帶出結局標題與歡樂的背景音樂反差
            await new Promise(r => setTimeout(r, 2000));
            stage4.classList.add("active");
        }

        // --- 跳轉與音樂淡出 ---
        function fadeOutAndNavigate(targetUrl, bgmId) {
            const finalStage = document.getElementById("stage-4");
            const bgm = document.getElementById(bgmId);

            if (finalStage) {
                finalStage.style.transition = "opacity 2s ease";
                finalStage.style.opacity = 0;
            }

            if (bgm && !bgm.paused) {
                let vol = bgm.volume;
                const fadeOut = setInterval(() => {
                    if (vol > 0.05) { 
                        vol -= 0.05; 
                        bgm.volume = Math.max(0, vol); 
                    } else { 
                        clearInterval(fadeOut); 
                        bgm.pause(); 
                        window.location.href = targetUrl; 
                    }
                }, 150); 
            } else {
                setTimeout(() => { window.location.href = targetUrl; }, 2500);
            }
        }
    </script>
</body>
</html>
