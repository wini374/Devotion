<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8"><title>ENDING B: ECHO</title>
    <style>
        body { background-color: #000; color: #ffaa00; font-family: "PingFang TC", sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        #text-container { text-align: center; max-width: 700px; padding: 0 20px; line-height: 2; font-size: 1.1rem; letter-spacing: 2px; }
        .fade-text { opacity: 0; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; transition: opacity 2.5s ease; text-shadow: 0 0 10px rgba(255,170,0,0.2); }
        .glitch { animation: gl 3s infinite; } @keyframes gl { 0%,100%{text-shadow:2px 0 red,-2px 0 blue;} 50%{text-shadow:-2px 0 red,2px 0 blue;} }
        #credits { opacity: 0; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; transition: opacity 3s; width: 100%; }
        .title { font-size: 2.5rem; letter-spacing: 15px; margin-bottom: 20px; font-weight: bold; color: #fff; }
        .sub { font-size: 1.2rem; letter-spacing: 5px; color: #ffaa00; margin-bottom: 50px; }
        .btn { background: transparent; border: 1px solid #ffaa00; color: #ffaa00; padding: 10px 30px; cursor: pointer; text-decoration: none; letter-spacing: 3px; }
        .btn:hover { background: #ffaa00; color: #000; }
    </style>
</head>
<body>
    <div id="text-container"></div>
    <div id="credits"><div class="title">DEVOTION</div><div class="sub">ENDING B - 迴音 (ECHO)</div><a href="index.html" class="btn">重置輪迴</a></div>
    <script>
        const lines = [
            "[ 警告：偵測到外部意識強行上傳至崩壞核心... ]",
            "看著螢幕上那句「毀滅我」，你終究還是無法做到。",
            "「如果這個世界需要你變成怪物才能團結...」<br>「那就讓他們自己去打吧。」",
            "在警報聲中，你切斷了矩陣的外部連線，<br>將自己的意識逆向灌入了他即將消散的核心。",
            "沒有了共同的敵人，外面的世界或許又會重燃戰火。<br>但這一次，你不在乎了。",
            "在無盡冰冷的代碼與黑暗中，你終於牽住了他的手。",
            "<span class='glitch'>這一次，你們一起留在了這裡。</span>"
        ];
        window.onload = async () => {
            const container = document.getElementById("text-container");
            await new Promise(r => setTimeout(r, 2000));
            for (let line of lines) {
                const div = document.createElement("div"); div.className = "fade-text"; div.innerHTML = line; container.appendChild(div);
                setTimeout(() => div.style.opacity = 1, 100);
                await new Promise(r => setTimeout(r, 3500 + line.length * 100));
                div.style.opacity = 0; await new Promise(r => setTimeout(r, 2500)); div.remove();
            }
            document.getElementById("credits").style.opacity = 1;
        };
    </script>
</body>
</html>
