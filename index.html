<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>SERVER_BACKUP_000.LOG</title>
    <style>
        /* 網頁基本設定，去除邊距，讓文件占滿全螢幕 */
        body { 
            margin: 0; 
            background-color: black; 
            color: #00ff00; 
            font-family: "Courier New", Courier, monospace; 
            overflow: hidden; 
        }
        
        /* 開機點擊畫面：用來觸發音樂播放 */
        #boot-screen { 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            cursor: pointer; 
            animation: blink 2s infinite; 
            font-size: 1.2rem;
            letter-spacing: 2px;
        }

        @keyframes blink { 
            0%, 100% { opacity: 1; } 
            50% { opacity: 0.3; } 
        }
        
        /* 隱藏的內容區，滿版顯示 */
        #content { 
            display: none; 
            height: 100vh; 
            width: 100vw; 
        }

        /* 嵌入 Google Doc 的視窗設定 */
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            background-color: white; /* 配合你 Google Doc 的底色 */
        }
    </style>
</head>
<body>

    <!-- BGM 音軌：讀取你上傳的音檔 -->
    <audio id="bgm" src="開頭.mp3" loop></audio>

    <!-- 開機畫面 -->
    <div id="boot-screen" onclick="startSystem()">
        [ SYSTEM OVERRIDE - CLICK TO INITIALIZE ]
    </div>

    <!-- 內容區塊：嵌入你的亂碼 Google Doc -->
    <div id="content">
        <!-- 這裡已經幫你把網址替換成 /preview 預覽模式了 -->
        <iframe src="https://docs.google.com/document/d/1j6AucKUG0tXKVQggAdvRn4O6SYkb01hmLrTcuDkrMgs/preview"></iframe>
    </div>

    <!-- 點擊後觸發音樂與畫面的程式碼 -->
    <script>
        function startSystem() {
            // 播放背景音樂
            document.getElementById('bgm').play();
            // 隱藏開機畫面
            document.getElementById('boot-screen').style.display = 'none';
            // 顯示 Google Doc
            document.getElementById('content').style.display = 'block';
        }
    </script>
</body>
</html>
