const sleep = ms => new Promise(
    resolve => setTimeout(resolve, ms)
);

const reducedMotion = window.matchMedia(
    '(prefers-reduced-motion: reduce)'
).matches;

/* ========================================
   C.mp3 音樂控制
======================================== */

let audioFadeToken = 0;

async function fadeInAudio(
    audio,
    target = 0.55,
    duration = 5000
) {

    audio.volume = 0;

    const token = ++audioFadeToken;

    try {

        await audio.play();

    } catch (error) {

        console.info(
            '瀏覽器阻止自動播放音樂；字幕仍會正常播放。',
            error
        );

        return;
    }

    const steps = 25;

    for (
        let n = 1;
        n <= steps && token === audioFadeToken;
        n++
    ) {

        audio.volume = Math.min(
            1,
            target * n / steps
        );

        await sleep(duration / steps);
    }
}

async function fadeOutAudio(
    audio,
    duration = 1800
) {

    ++audioFadeToken;

    if (audio.paused) return;

    const initial = audio.volume;
    const steps = 20;

    for (let n = 1; n <= steps; n++) {

        audio.volume = Math.max(
            0,
            initial * (1 - n / steps)
        );

        await sleep(duration / steps);
    }

    audio.pause();
}

/* ========================================

function setPhase(phase) {

    document.body.classList.remove(
        'phase-1',
        'phase-2',
        'phase-3'
    );

    document.body.classList.add(
        'phase-' + phase

}

    duration = 2600
) {

        'system-message'
    );

    el.textContent = text;

    el.style.opacity = '1';

    await sleep(duration);

    el.style.opacity = '0';

    await sleep(
        reducedMotion ? 80 : 1450
    );
}

/* ========================================
   播放敘事文字
======================================== */

async function showNarrativeLine(line) {

    setPhase(line.phase);

    const host = document.getElementById(
        'story'
    );

    const el = document.createElement('div');

    el.className =
        'line' + (line.kind ? ' ' + line.kind : '');

    el.innerHTML = line.text;

    host.appendChild(el);

    /* 新王登基前，短暫黑屏 */

    if (line.event === 'crown') {

        const cover = document.getElementById(
            'purge-screen'
        );

        cover.style.opacity = '1';

        await sleep(1350);

        cover.style.opacity = '0';

        await sleep(1600);
    }

    /* 字幕淡入 */

    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            el.style.opacity = '1';

        });
    });

    /* 計算字幕停留時間 */

    const plain = line.text.replace(
        /<br\s*\/?\s*>/gi,
        ''
    );

    const stayTime =
        Math.max(
            3200,
            2300 + plain.length * 75
        ) +
        (line.kind === 'resolve' ? 1500 : 0);

    await sleep(stayTime);

    /* 字幕淡出 */

    el.style.opacity = '0';

    await sleep(
        reducedMotion ? 100 : 1650
    );

    el.remove();

    /* 靈魂抹除後播放權限協定 */

    if (line.event === 'purge') {

        await showPurgeProtocol();
    }
}

    await sleep(5000);

    document.getElementById(
        'logout-btn'
    ).classList.add('visible');
}

/* ========================================
   初始化新紀元
   音樂、畫面淡出並返回首頁
======================================== */

let leaving = false;

document.getElementById(
    'logout-btn'
).addEventListener(
    'click',
    async event => {

        event.preventDefault();

        if (leaving) return;

        leaving = true;

        const btn = document.getElementById(
            'logout-btn'
        );

        btn.style.pointerEvents = 'none';

        const ending = document.getElementById(
            'ending-stage'
        );

        ending.style.transition =
            'opacity 1.8s ease';

        ending.style.opacity = '0';

        await Promise.all([

            fadeOutAudio(
                document.getElementById('end-bgm')
            ),

            sleep(1800)

        ]);

        window.location.href = 'index.html';
    }
);

/* ========================================
   啟動
======================================== */

window.addEventListener(
    'load',
    () => {
        void play();
    }
);

</script>

</body>
</html>
