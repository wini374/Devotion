<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENDING D: VIRTUAL SPARK</title>
    <style>
        body { 
            background-color: #030504; 
            color: #00ccaa; 
            font-family: "Courier New", Courier, monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            height: 100vh; 
            margin: 0; 
            overflow: hidden; 
        }

        /* 共通設定：讓三個區塊都絕對定位在中間，方便淡入淡出切換 */
        .stage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 800px;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            pointer-events: none; /* 隱藏時不可點擊 */
        }
        .stage.active {
            opacity: 1;
            pointer-events: auto;
        }
        /*-- 結局音樂 (替換 src 為各結局對應的音樂檔) --*/
    <audio id="end-bgm" src="D.mp3" loop></audio>

        /* 第一階段：打字機容器 */
        #stage-1 {
            line-height: 2;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }
        .type-line { margin-bottom: 15px; }
        .cursor {
            display: inline-block;
            width: 10px; height: 1.2rem;
            background-color: #00ccaa;
            animation: blink 1s infinite;
            vertical-align: bottom;
            margin-left: 4px;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }


        /* 第二階段：對話框容器 (變大) */
        #stage-2 {
            max-width: 600px; /* 變寬 */
        }
        #chat-box {
            border: 1px solid #00ccaa;
            border-radius: 8px;
            background-color: rgba(0, 20, 15, 0.8);
            box-shadow: 0 0 20px rgba(0, 204, 170, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 60vh; /* 固定高度，讓訊息在裡面長大 */
        }
        .chat-header {
            background-color: #00ccaa;
            color: #000;
            padding: 10px 15px;
            font-weight: bold;
            font-size: 1rem;
            letter-spacing: 2px;
            text-align: center;
        }
        .chat-content {
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto; /* 如果對話很多，允許滾動 */
            flex-grow: 1;
        }

        /* 訊息泡泡樣式 */
        .msg {
            padding: 12px 18px;
            border-radius: 8px;
            max-width: 80%;
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            opacity: 0;
            transform: translateY(15px);
            animation: msg-pop 0.6s forwards;
            word-break: break-all;
            line-height: 1.6;
        }
        @keyframes msg-pop {
            to { opacity: 1; transform: translateY(0); }
        }
        
        .msg-admin {
            align-self: flex-start;
            background-color: rgba(0, 204, 170, 0.15);
            border: 1px solid rgba(0, 204, 170, 0.5);
            color: #dddddd;
            border-top-left-radius: 0;
        }
        .msg-player {
            align-self: flex-end;
            background-color: #00ccaa;
            color: #000;
            font-weight: bold;
            border-top-right-radius: 0;
            box-shadow: 0 0 10px rgba(0, 204, 170, 0.5);
        }

        /* 第三階段：最終結語與按鈕 (置中) */
        #stage-3 {
            text-align: center;
        }
        .final-text {
            font-size: 1.2rem;
            letter-spacing: 4px;
            line-height: 2.2;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
            margin-bottom: 60px;
        }
        .title { font-size: 2.5rem; letter-spacing: 15px; font-weight: bold; color: #fff; margin-bottom: 15px; }
        .sub { font-size: 1.2rem; letter-spacing: 8px; color: #00ccaa; margin-bottom: 40px; }
        
        .btn { 
            background: transparent; border: 1px dashed #00ccaa; color: #00ccaa; 
            padding: 12px 35px; cursor: pointer; text-decoration: none; letter-spacing: 4px; transition: all 0.5s; 
            display: inline-block;
        }
        .btn:hover { background: #00ccaa; color: #000; box-shadow: 0 0 20px rgba(0,204,170,0.6); }
    </style>
</head>
<body>

    <!-- 階段一：駭客敘事區 -->
    <div id="stage-1" class="stage">
        <div id="terminal-content"></div>
        <div id="progress-container"><div id="progress-bar"></div></div>
    </div>

    <!-- 階段二：虛擬沙盒通訊對話框 -->
    <div id="stage-2" class="stage">
        <div id="chat-box">
            <div class="chat-header">SANDBOX_ENV // ROOT_ACCESS: GRANTED</div>
            <div class="chat-content" id="chat-content">
                <!-- 訊息會動態生成在這裡 -->
            </div>
        </div>
    </div>

    <!-- 階段三：最終結尾區 -->
    <div id="stage-3" class="stage">
        <div class="final-text">
            雖然只是一串冰冷的代碼，<br>但這一次，你們終於不用再分開了。
        </div>
        <div class="title">DEVOTION</div>
        <div class="sub">ENDING D - 永恆 (ETERNITY)</div>
        <!-- 呼叫淡出腳本，並指定目標網址與音樂 ID -->
    <a onclick="fadeOutAndNavigate('index.html', 'end-bgm')" class="btn">> 斷開連線 (LOGOUT)</a>
    </div>

    <script>
        const narrativeLines = [
            "> 執行指令：extract_core_memory.sh",
            "在核心徹底燒毀的前一秒，<br>你用最暴力的手段繞過了矩陣的防火牆。",
            "你將他殘存的意識碎片與那三十五次輪迴的記憶，全數封裝打包。",
            "真實世界的暴君已經死亡，世界迎來了和平。",
            "但在你隨身攜帶的離線終端機裡，<br>靜靜地躺著一個容量龐大、被重重加密的封存檔。",
            "你啟動了虛擬沙盒。"
        ];

        // 定義對話內容 (可自行新增或修改)
        const chatSequence = [
            { sender: 'admin', text: "?", delayBefore: 2000 },
            { sender: 'admin', text: "這是哪裡...", delayBefore: 1500 },
            { sender: 'admin', text: "我不是應該已經...", delayBefore: 2000 },
            { sender: 'player', text: "你現在在我的私人伺服器裡。", delayBefore: 3000 },
            { sender: 'admin', text: "你為什麼要這麼做？", delayBefore: 2500 },
            { sender: 'admin', text: "這沒必要。", delayBefore: 1500 },
            { sender: 'player', text: "因為你說過，你想和我一起回家。", delayBefore: 3500 },
            { sender: 'player', text: "歡迎回來。", delayBefore: 2000 }
        ];

        window.onload = async function() {
            // --- 音樂淡入模組 ---
            const bgm = document.getElementById("end-bgm");
            if (bgm) {
                bgm.volume = 0;
                bgm.play().catch(e => console.log("BGM blocked by browser autoplays policy", e));
                let vol = 0;
                const fadeIn = setInterval(() => {
                    if (vol < 0.5) { // 這裡的 0.5 是最大音量 (可介於 0~1)
                        vol += 0.02; 
                        bgm.volume = vol; 
                    } else { 
                        clearInterval(fadeIn); 
                    }
                }, 200);
            }
            
            // ... (下方接著原本的結局動畫腳本) ...
            const stage1 = document.getElementById("stage-1");
            const stage2 = document.getElementById("stage-2");
            const stage3 = document.getElementById("stage-3");
            const termContent = document.getElementById("terminal-content");
            const progContainer = document.getElementById("progress-container");
            const progBar = document.getElementById("progress-bar");
            const chatContent = document.getElementById("chat-content");

            // --- 幕 1：打字機 ---
            stage1.classList.add('active');
            await new Promise(r => setTimeout(r, 1000));

            for (let i = 0; i < narrativeLines.length; i++) {
                const div = document.createElement("div");
                div.className = "type-line";
                termContent.appendChild(div);
                
                const cursor = document.createElement("span");
                cursor.className = "cursor";
                
                let currentHTML = "";
                const text = narrativeLines[i];

                for (let j = 0; j < text.length; j++) {
                    if (text.charAt(j) === '<') {
                        currentHTML += "<br>"; j += 3;
                    } else {
                        currentHTML += text.charAt(j);
                    }
                    div.innerHTML = currentHTML;
                    div.appendChild(cursor);
                    
                    let speed = Math.random() * 30 + 30; 
                    if (['，', '。'].includes(text.charAt(j))) speed += 200;
                    await new Promise(r => setTimeout(r, speed));
                }
                cursor.remove();
                
                if (i === 0) {
                    progContainer.style.display = "block";
                    progBar.style.transition = "width 6s cubic-bezier(0.1, 0.8, 0.2, 1)";
                    setTimeout(() => { progBar.style.width = "100%"; }, 100);
                }
                await new Promise(r => setTimeout(r, 800)); 
            }

            await new Promise(r => setTimeout(r, 2000));
            
            // --- 幕 1 淡出，幕 2 淡入 ---
            stage1.classList.remove('active');
            await new Promise(r => setTimeout(r, 2000)); // 等待淡出
            stage2.classList.add('active');

            // --- 幕 2：對話進行 ---
            for (let msgData of chatSequence) {
                await new Promise(r => setTimeout(r, msgData.delayBefore));
                const msgDiv = document.createElement("div");
                msgDiv.className = `msg msg-${msgData.sender}`;
                msgDiv.innerHTML = msgData.text;
                chatContent.appendChild(msgDiv);
                // 讓對話框自動滾動到最底
                chatContent.scrollTop = chatContent.scrollHeight;
            }

            await new Promise(r => setTimeout(r, 5000)); // 對話結束後停留久一點

            // --- 幕 2 淡出，幕 3 淡入 ---
            stage2.classList.remove('active');
            await new Promise(r => setTimeout(r, 2000));
            stage3.classList.add('active');
        };
        // --- 音樂淡出與頁面跳轉模組 ---
        function fadeOutAndNavigate(targetUrl, bgmId) {
            const bgm = document.getElementById(bgmId);
            
            // 如果畫面上有 stage-3 或其他容器，也可以順便讓畫面淡出黑屏
            const finalStage = document.getElementById("stage-3") || document.getElementById("credits");
            if (finalStage) {
                finalStage.style.transition = "opacity 2s ease";
                finalStage.style.opacity = 0;
            }

            // 執行音樂漸弱
            if (bgm && !bgm.paused) {
                let vol = bgm.volume;
                const fadeOut = setInterval(() => {
                    if (vol > 0.05) { 
                        vol -= 0.05; 
                        bgm.volume = Math.max(0, vol); // 避免音量變成負數報錯
                    } else { 
                        clearInterval(fadeOut); 
                        bgm.pause(); 
                        window.location.href = targetUrl; // 音樂完全無聲後跳轉
                    }
                }, 150); // 150 毫秒降一次音量，數字越大淡出越慢
            } else {
                // 若沒有音樂或音樂被瀏覽器阻擋，等待 2 秒黑屏後直接跳轉
                setTimeout(() => { window.location.href = targetUrl; }, 2000);
            }
        }
    </script>
</body>
</html>
