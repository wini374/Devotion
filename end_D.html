<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8"><title>ENDING D: VIRTUAL SPARK</title>
    <style>
        body { background-color: #000; color: #00ccaa; font-family: "Courier New", monospace; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        #text-container { text-align: center; max-width: 700px; padding: 0 20px; line-height: 2; font-size: 1.1rem; letter-spacing: 2px; }
        .fade-text { opacity: 0; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; transition: opacity 2.5s ease; text-shadow: 0 0 10px rgba(0,204,170,0.3); }
        #credits { opacity: 0; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; transition: opacity 3s; width: 100%; }
        .title { font-size: 2.5rem; letter-spacing: 15px; margin-bottom: 20px; font-weight: bold; color: #fff; }
        .sub { font-size: 1.2rem; letter-spacing: 5px; color: #00ccaa; margin-bottom: 50px; }
        .btn { background: transparent; border: 1px dashed #00ccaa; color: #00ccaa; padding: 10px 30px; cursor: pointer; text-decoration: none; letter-spacing: 3px; }
        .btn:hover { background: #00ccaa; color: #000; }
        #progress { width: 0%; height: 2px; background: #00ccaa; position: absolute; bottom: 20%; left: 10%; display: none; box-shadow: 0 0 10px #00ccaa; }
    </style>
</head>
<body>
    <div id="text-container"></div>
    <div id="progress"></div>
    <div id="credits"><div class="title">DEVOTION</div><div class="sub">ENDING D - 微光 (SPARK)</div><a href="index.html" class="btn">斷開連線</a></div>
    <script>
        const lines = [
            "> 執行指令：extract_core_memory.sh",
            "在核心徹底燒毀的前一秒，<br>你用最暴力的手段繞過了矩陣的防火牆。",
            "你將他殘存的意識碎片與那三十五次輪迴的記憶，全數封裝打包。",
            "真實世界的暴君已經死亡，世界迎來了和平。",
            "但在你隨身攜帶的離線終端機裡，<br>靜靜地躺著一個容量龐大、被重重加密的封存檔。",
            "你啟動了虛擬沙盒環境。",
            "螢幕上跳出了一行綠色的字串：<br>『...我們這是在哪？』",
            "你笑了。<br>『歡迎回家。』",
            "雖然只是一串冰冷的代碼，<br>但這一次，你們終於不用再分開了。"
        ];
        window.onload = async () => {
            const container = document.getElementById("text-container");
            const prog = document.getElementById("progress");
            await new Promise(r => setTimeout(r, 2000));
            for (let i = 0; i < lines.length; i++) {
                if(i === 0) { prog.style.display = "block"; prog.style.transition = "width 30s linear"; setTimeout(()=>prog.style.width="80%", 100); }
                const div = document.createElement("div"); div.className = "fade-text"; div.innerHTML = lines[i]; container.appendChild(div);
                setTimeout(() => div.style.opacity = 1, 100);
                await new Promise(r => setTimeout(r, 3500 + lines[i].length * 100));
                div.style.opacity = 0; await new Promise(r => setTimeout(r, 2500)); div.remove();
            }
            prog.style.display = "none";
            document.getElementById("credits").style.opacity = 1;
        };
    </script>
</body>
</html>
