<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENDING D: VIRTUAL SPARK</title>
    <style>
        body { 
            background-color: #030504; 
            color: #00ccaa; 
            font-family: "Courier New", Courier, monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden; 
        }

        /* 第一階段：打字機容器 */
        #terminal-container {
            width: 80%;
            max-width: 700px;
            margin-top: 10vh;
            line-height: 2;
            font-size: 1.1rem;
            letter-spacing: 2px;
            min-height: 200px;
        }
        .type-line { margin-bottom: 15px; }
        
        .cursor {
            display: inline-block;
            width: 10px; height: 1.2rem;
            background-color: #00ccaa;
            animation: blink 1s infinite;
            vertical-align: bottom;
            margin-left: 4px;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* 讀取進度條 */
        #progress-container { width: 80%; max-width: 700px; margin-top: 20px; display: none; }
        #progress-bar { height: 2px; background: #00ccaa; width: 0%; box-shadow: 0 0 10px #00ccaa; }

        /* 第二階段：對話框容器 */
        #chat-box {
            display: none; /* 初始隱藏 */
            width: 90%;
            max-width: 450px;
            margin-top: 40px;
            border: 1px solid #00ccaa;
            border-radius: 8px;
            background-color: rgba(0, 20, 15, 0.8);
            box-shadow: 0 0 20px rgba(0, 204, 170, 0.2);
            overflow: hidden;
            opacity: 0;
            transition: opacity 1.5s ease;
        }
        .chat-header {
            background-color: #00ccaa;
            color: #000;
            padding: 8px 15px;
            font-weight: bold;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
        .chat-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-height: 150px;
        }

        /* 訊息泡泡樣式 */
        .msg {
            padding: 10px 15px;
            border-radius: 6px;
            max-width: 75%;
            font-size: 1rem;
            letter-spacing: 1px;
            opacity: 0;
            transform: translateY(10px);
            animation: msg-pop 0.5s forwards;
            word-break: break-all;
        }
        @keyframes msg-pop {
            to { opacity: 1; transform: translateY(0); }
        }
        
        .msg-admin {
            align-self: flex-start;
            background-color: rgba(0, 204, 170, 0.15);
            border: 1px solid rgba(0, 204, 170, 0.5);
            color: #dddddd;
            border-top-left-radius: 0;
        }
        .msg-player {
            align-self: flex-end;
            background-color: #00ccaa;
            color: #000;
            font-weight: bold;
            border-top-right-radius: 0;
            box-shadow: 0 0 10px rgba(0, 204, 170, 0.5);
        }

        /* 第三階段：最終結語與按鈕 */
        #final-section {
            opacity: 0;
            text-align: center;
            margin-top: 50px;
            transition: opacity 2s ease;
        }
        .final-text {
            font-size: 1.1rem;
            letter-spacing: 3px;
            line-height: 2;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
            margin-bottom: 40px;
        }
        .title { font-size: 2rem; letter-spacing: 10px; font-weight: bold; color: #fff; margin-bottom: 10px; }
        .sub { font-size: 1rem; letter-spacing: 5px; color: #00ccaa; margin-bottom: 30px; }
        
        .btn { 
            background: transparent; border: 1px dashed #00ccaa; color: #00ccaa; 
            padding: 10px 30px; cursor: pointer; text-decoration: none; letter-spacing: 3px; transition: all 0.5s; 
        }
        .btn:hover { background: #00ccaa; color: #000; box-shadow: 0 0 15px rgba(0,204,170,0.5); }
    </style>
</head>
<body>

    <!-- 打字機敘事區 -->
    <div id="terminal-container"></div>
    
    <!-- 備份進度條 -->
    <div id="progress-container"><div id="progress-bar"></div></div>

    <!-- 虛擬沙盒通訊對話框 -->
    <div id="chat-box">
        <div class="chat-header">SANDBOX_ENV // PORT: SECURE</div>
        <div class="chat-content" id="chat-content">
            <!-- 訊息會動態生成在這裡 -->
        </div>
    </div>

    <!-- 最終結尾區 -->
    <div id="final-section">
        <div class="final-text">
            雖然只是一串冰冷的代碼，<br>但這一次，你們終於不用再分開了。
        </div>
        <div class="title">DEVOTION</div>
        <div class="sub">ENDING D - 永恆 ETERNITY</div>
        <a href="index.html" class="btn">> 斷開連線 (LOGOUT)</a>
    </div>

    <script>
        // 第一階段：駭客敘事腳本
        const narrativeLines = [
            "> 執行指令：extract_core_memory.sh",
            "在核心徹底燒毀的前一秒，<br>你用最暴力的手段繞過了矩陣的防火牆。",
            "你將他殘存的意識碎片與那三十五次輪迴的記憶，全數封裝打包。",
            "真實世界的暴君已經死亡，世界迎來了和平。",
            "但在你隨身攜帶的離線終端機裡，<br>靜靜地躺著一個容量龐大、被重重加密的封存檔。",
            "你啟動了虛擬沙盒環境。"
        ];

        window.onload = async function() {
            const container = document.getElementById("terminal-container");
            const progContainer = document.getElementById("progress-container");
            const progBar = document.getElementById("progress-bar");
            const chatBox = document.getElementById("chat-box");
            const chatContent = document.getElementById("chat-content");
            const finalSection = document.getElementById("final-section");

            // 1. 延遲開場
            await new Promise(r => setTimeout(r, 1500));

            // 2. 執行打字機效果
            for (let i = 0; i < narrativeLines.length; i++) {
                const div = document.createElement("div");
                div.className = "type-line";
                container.appendChild(div);
                
                const cursor = document.createElement("span");
                cursor.className = "cursor";
                
                let currentHTML = "";
                const text = narrativeLines[i];

                for (let j = 0; j < text.length; j++) {
                    if (text.charAt(j) === '<') {
                        // 快速跳過 <br> 標籤
                        currentHTML += "<br>";
                        j += 3;
                    } else {
                        currentHTML += text.charAt(j);
                    }
                    div.innerHTML = currentHTML;
                    div.appendChild(cursor);
                    
                    let speed = Math.random() * 30 + 30; 
                    if (['，', '。'].includes(text.charAt(j))) speed += 200;
                    
                    await new Promise(r => setTimeout(r, speed));
                }
                
                cursor.remove();
                
                // 在第一句印完後，啟動進度條
                if (i === 0) {
                    progContainer.style.display = "block";
                    progBar.style.transition = "width 6s cubic-bezier(0.1, 0.8, 0.2, 1)";
                    setTimeout(() => { progBar.style.width = "100%"; }, 100);
                }

                await new Promise(r => setTimeout(r, 800)); 
            }

            // 隱藏進度條，為對話框騰出空間
            await new Promise(r => setTimeout(r, 1000));
            progContainer.style.display = "none";

            // 3. 顯示對話框
            chatBox.style.display = "block";
            setTimeout(() => { chatBox.style.opacity = 1; }, 100);

            // 4. 對話演出 (模擬收發訊息的延遲)
            await new Promise(r => setTimeout(r, 2000)); // 等待 2 秒，營造他在適應新環境的空白

            // Admin 的第一則訊息
            const msg1 = document.createElement("div");
            msg1.className = "msg msg-admin";
            msg1.innerHTML = "?";
            chatContent.appendChild(msg1);

            await new Promise(r => setTimeout(r, 1500));

            // Admin 的第二則訊息
            const msg2 = document.createElement("div");
            msg2.className = "msg msg-admin";
            msg2.innerHTML = "我們在哪";
            chatContent.appendChild(msg2);

            await new Promise(r => setTimeout(r, 2500)); // 玩家遲疑/打字的停頓

            // Player 的回覆
            const msg3 = document.createElement("div");
            msg3.className = "msg msg-player";
            msg3.innerHTML = "歡迎回來";
            chatContent.appendChild(msg3);

            // 5. 顯示最終結尾與按鈕
            await new Promise(r => setTimeout(r, 3000)); // 看完訊息的餘韻
            finalSection.style.opacity = 1;
        };
    </script>
</body>
</html>
